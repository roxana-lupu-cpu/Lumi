<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMI – Învățăm prin joc</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Sari la conținut</a>
<header>
  <button id="bHome" class="logo" aria-label="LUMI, mergi la meniul principal"><span aria-hidden="true">🦉</span> LUMI <small>Învățăm prin joc</small></button>
  <button id="bSet" aria-expanded="false" aria-controls="settings">⚙️ Setări</button>
</header>
<section id="settings" hidden aria-label="Setări">
  <label>Mărimea textului
    <select id="font"><option value="1">Normal</option><option value="1.2">Mare</option><option value="1.45">Foarte mare</option></select></label>
  <label>Nivel
    <select id="level"><option value="1">Nivelul 1</option><option value="2">Nivelul 2</option><option value="3">Nivelul 3</option></select></label>
  <label>Număr de variante
    <select id="opts"><option value="auto">Automat</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
  <label>Numere
    <select id="range"><option value="5">0–5</option><option value="10">0–10</option><option value="20">0–20</option></select></label>
  <label><input type="checkbox" id="anim"> Animații</label>
  <label><input type="checkbox" id="sound"> Sunet (voce)</label>
  <label><input type="checkbox" id="rewards"> Stele și recompense</label>
  <label><input type="checkbox" id="adapt"> Dificultate adaptată automat</label>
</section>
<main id="main"></main>
<script src="js/catalog.js"></script>
<script src="js/games/cuvant-imagine.js"></script>
<script src="js/games/sunet-initial.js"></script>
<script src="js/games/cifra-multime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
